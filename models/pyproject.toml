[project]
name = "models"
version = "0.1.0"
description = "Implementation of the models in the book"
readme = "README.md"
authors = [
    { name = "Caio Lagana Fernandes", email = "caiolagana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keras>=3.15.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
models = "models:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
